# Synthetic secret-shaped test vectors (fake Slack, GitHub, Stripe and similar strings) are part of our tests
# of the Egress Guard: they are generated test data, not real credentials. Excluded from GitHub secret scanning
# so the test sets can be published. Everything else stays scanned (gitleaks also runs in CI).
paths-ignore:
  - "crates/egress/**"
  - "crates/*/tests/**"
  - "crates/*/fuzz/**"
  - "tools/**"
  - "scripts/**"
  - "docs/evidence/**"
  - "docs/plans/**"
  - "**/*.jsonl"
  - ".gitleaks.toml"
  - ".env.example"
