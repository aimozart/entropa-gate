title = "entropa-rust gitleaks config"

[extend]
useDefault = true

# Every allowlist entry below is a confirmed false positive or a non-source path, with its reason.
# Run: scripts/secret-scan.sh (tree + full history, in Docker, findings redacted).
[allowlist]
description = "confirmed false positives and generated paths"
paths = [
  # Public NIST ACVP test vectors: hex strings shaped like keys, published by NIST, never credentials
  # (their `seed` and `sk` fields are public KAT inputs). See crates/core/tests/vectors/README.md.
  '''crates/core/tests/vectors/.*''',
  '''crates/core/tests/nist_kat\.rs''',
  # The captured AWS KMS vector holds a PUBLIC key, one message and one signature; no private key
  # exists outside KMS. See crates/kms/tests/vectors/README.md.
  '''crates/kms/tests/vectors/.*''',
  # Build output, gitignored and not part of the repository: compiled libraries of the pem, pkcs8 and
  # rustls crates contain the literal PEM header text "-----BEGIN ... PRIVATE KEY-----" as a string
  # (14 hits on 2026-10-20, all in target/**/*.rmeta). The full-history scan covers what is committed.
  '''(^|/)target/.*''',
  '''(^|/)node_modules/.*''',
  '''crates/core/fuzz/(corpus|artifacts|target)/.*''',
  # Independent golden-vector generator of stage S7b: line 8 `KEY = "0123456789abcdef..."` is a public synthetic
  # test constant (a repeating hex pattern used to derive demo keys), like the other vector files above; it
  # protects nothing. Allowlisted by exact path so a real secret added to another script is still caught.
  '''docs/evidence/s7b-gen-vectors\.py''',
  # PUBLISH-1 (2026-11-17): SYNTHETIC secret-shaped vectors. A security product must contain strings that look like secrets to prove it detects them. Every one is generated by a tool
  # in this repository (a project rule: synthetic data only) and none is a credential. Allowlisted by directory so a real secret added anywhere else is still caught.
  # The egress guard's detection sets (generated by tools/eg1, tools/eg1e, tools/eg1f; DEV sets written by the author) and its tests:
  '''crates/egress/eval_dev[^/]*/.*''',
  '''crates/egress/tests/.*''',
  '''crates/egress/fuzz/seeds/.*''',
  # Recorded red-phase output that echoes those vectors, and the generators that build them:
  '''docs/evidence/eg1[a-f]?/.*''',
  '''tools/eg1[a-f]?/.*\.py''',
  # The JWT-sanitiser unit test in the contact service holds a test string shaped like a token (one old finding, commit d25252d; a false positive, not a credential):
  '''crates/contact/src/gmail\.rs''',
  # The clippy report of the export check echoes one synthetic test string from a suggestion (`"token: abc.def-123_xyz".to_string()`): a test constant, not a credential.
  '''docs/evidence/publish1/export-clippy-report\.txt''',
]

# Recorded for the next reader, not an allowlist entry because gitleaks does not flag it:
# .env.example line `ENTROPA_GMAIL_SA_KEY` (159 characters, no digits, English words such as type,
# service, account, example, private, key) is a documentation template of a service-account JSON,
# far too short to be a real key. Structure checked without printing it (the reviewer, 2026-10-20).
