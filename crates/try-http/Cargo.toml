[package]
name = "entropa-try-http"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The HTTP binding of 'Try the gate' (LS3b): a small binary around entropa-try's pure handler; adds client-key, caps, limits and CORS, no decision logic (a stage record (not published))"
publish = false

[lib]
name = "entropa_try_http"
path = "src/lib.rs"

[[bin]]
name = "entropa-try-http"
path = "src/main.rs"

[[bin]]
name = "try-sealed"
path = "src/bin/try_sealed.rs"

[dependencies]
entropa-witness = { path = "../witness" }
serde = { workspace = true }
hex = { workspace = true }
sha2 = "0.10"
entropa-core = { path = "../core", version = "0.2.0" }
entropa-try = { path = "../try" }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"
entropa-ledger = { path = "../ledger" }
serde_json = { workspace = true }

[lints]
workspace = true
