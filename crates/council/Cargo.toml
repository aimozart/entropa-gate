[package]
name = "entropa-council"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish = false
description = "The pure, deterministic core of the Decision Review Council (the council design notes): closed-code events, session state machine and quorum, reliability scoring, planted-fault evaluation, retrieval provenance, replay. No model, no cloud."

[dependencies]
entropa-core = { path = "../core", version = "0.2.0" }
entropa-synthetic = { path = "../synthetic" }
blake3 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = "1"
entropa-policy = { path = "../policy" }
entropa-approvals = { path = "../approvals" }

[lints]
workspace = true
