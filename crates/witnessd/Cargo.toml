[package]
name = "entropa-witnessd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish = false
build = "build.rs"
description = "Checkpoint witness service: wraps the entropa-witness core with file-backed compare-and-swap state and a small HTTP interface; runs on any cloud (stage P6)."

[[bin]]
name = "entropa-witnessd"
path = "src/main.rs"

[dependencies]
entropa-core = { path = "../core", version = "0.2.0" }
entropa-witness = { path = "../witness" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde_json = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }

entropa-kms = { path = "../kms", features = ["aws"], optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest"], optional = true }

[build-dependencies]
cc = "1"

[features]
default = []
# S3-backed state and an AWS KMS signer, for running on AWS Lambda. Off by default: the default build compiles no AWS crate.
aws = ["dep:entropa-kms", "dep:aws-sdk-s3", "dep:aws-config"]

[dev-dependencies]
entropa-core = { path = "../core", version = "0.2.0" }

[lints]
workspace = true
