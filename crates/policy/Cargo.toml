[package]
name = "entropa-policy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish = false
description = "Cedar policy gate combined with the approvals gate (docs/ARCHITECTURE-CEDAR.md)."

[dependencies]
entropa-core = { path = "../core", version = "0.2.0", default-features = false }
entropa-approvals = { path = "../approvals", default-features = false }
cedar-policy = { version = "=4.14.0", optional = true }
blake3 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }

[features]
# `engine` (default) = the Cedar policy engine. Without it only the record decoding and digest remain (BV1: the browser verifier). `signing` forwards to entropa-core.
default = ["engine", "signing"]
engine = ["dep:cedar-policy"]
signing = ["entropa-core/signing", "entropa-approvals/signing"]
# Engines that trust role and has_key from the request. Tests and fuzzing only (ADR 0019).
trust-request-fields = []

[dev-dependencies]
proptest = "1"
entropa-policy = { path = ".", features = ["trust-request-fields"], default-features = false }

[lints]
workspace = true
