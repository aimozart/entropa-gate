[package]
name = "entropa-witness-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
entropa-witness = { path = ".." }
entropa-core = { path = "../../core" }
serde_json = "1"
hex = "0.4"

[workspace]

[[bin]]
name = "request_decode"
path = "fuzz_targets/request_decode.rs"
test = false
doc = false

[[bin]]
name = "statement_verify"
path = "fuzz_targets/statement_verify.rs"
test = false
doc = false

[[bin]]
name = "cosign_structured"
path = "fuzz_targets/cosign_structured.rs"
test = false
doc = false

[[bin]]
name = "anchor_decode"
path = "fuzz_targets/anchor_decode.rs"
test = false
doc = false
