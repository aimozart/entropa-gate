[package]
name = "entropa-contact"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish = false
description = "Serverless contact-form service: validates a submission and forwards it to one private inbox, never exposing an address."

[[bin]]
name = "entropa-contact"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
jsonwebtoken = "9"

[lints]
workspace = true
