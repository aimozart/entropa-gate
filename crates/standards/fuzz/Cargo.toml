[package]
name = "entropa-standards-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
entropa-standards = { path = ".." }

[workspace]

[[bin]]
name = "search_query"
path = "fuzz_targets/search_query.rs"
test = false
doc = false

[[bin]]
name = "text_tokens"
path = "fuzz_targets/text_tokens.rs"
test = false
doc = false

[[bin]]
name = "seal_open"
path = "fuzz_targets/seal_open.rs"
test = false
doc = false

[[bin]]
name = "tool_call"
path = "fuzz_targets/tool_call.rs"
test = false
doc = false
