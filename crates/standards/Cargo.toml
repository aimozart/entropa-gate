[package]
name = "entropa-standards"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish = false
description = "Deterministic retrieval over a sealed, versioned standards corpus (R1): ingest, BM25, abstention gate, cite check, read-only MCP server."

[[bin]]
name = "entropa-standards"
path = "src/main.rs"

[[bin]]
name = "entropa-standards-mcp"
path = "src/bin/entropa-standards-mcp.rs"

[dependencies]
entropa-mcp = { path = "../mcp", version = "0.2.0" }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "macros", "transport-io", "transport-async-rw"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "sync"] }
sha2 = "0.10"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
