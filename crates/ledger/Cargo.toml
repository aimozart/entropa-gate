[package]
name = "entropa-ledger"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish = false
description = "Public explorer ledger core (docs/ARCHITECTURE-EXPLORER.md): closed-code event schema, append-only store, synthetic scenario generator, static bundle export."

[dependencies]
entropa-core = { path = "../core", version = "0.2.0", default-features = false }
entropa-approvals = { path = "../approvals", default-features = false }
entropa-policy = { path = "../policy", default-features = false }
entropa-witness = { path = "../witness", default-features = false }
blake3 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = "1"

[features]
# default = everything the explorer and tests use; `--no-default-features` = verification only (BV1).
default = ["signing", "engine"]
signing = ["entropa-core/signing", "entropa-approvals/signing", "entropa-policy/signing", "entropa-witness/signing"]
engine = ["entropa-policy/engine"]

[lints]
workspace = true
